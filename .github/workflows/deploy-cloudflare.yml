name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 6e31cfcdcb161accbdb747946ebcf2fd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Next.js build
        run: npm run build

      - name: Deploy to existing Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6e31cfcdcb161accbdb747946ebcf2fd
          command: deploy --name shree-krishna-exports --yes

      - name: Cloudflare token not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "Automatic deployment is ready, but repository secret CLOUDFLARE_API_TOKEN is not configured."
          echo "Add a Cloudflare API token with Workers Scripts:Edit permission to enable automatic production deployments."
          exit 1
